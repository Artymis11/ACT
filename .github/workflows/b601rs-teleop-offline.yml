name: B601-RS teleop offline regression

on:
  push:
    paths:
      - 'ACT真机/手柄遥操与数字孪生/rebot-b601rs-teleop-twin/**'
      - '.github/workflows/b601rs-teleop-offline.yml'
  pull_request:
    paths:
      - 'ACT真机/手柄遥操与数字孪生/rebot-b601rs-teleop-twin/**'
      - '.github/workflows/b601rs-teleop-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ACT真机/手柄遥操与数字孪生/rebot-b601rs-teleop-twin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch hash-pinned input references
        run: python -B tools/bootstrap.py --teleop-only
      - name: Run offline software checks
        run: python -B tools/check.py

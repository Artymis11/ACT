name: Offline regression
on: [push, pull_request, workflow_dispatch]
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch pinned input references only
        run: python tools/bootstrap.py --teleop-only
      - name: Offline software checks
        run: python tools/check.py

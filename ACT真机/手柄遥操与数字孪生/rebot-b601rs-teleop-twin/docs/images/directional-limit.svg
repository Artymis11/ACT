<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
<title id="title">J2和J3单侧70%工作区间</title><desc id="desc">从原生0度开始，180度参考跨度取70%得到126度工作上限。边界只挡继续向外，反向仍允许。</desc>
<style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;fill:#eaf1ec}.small{fill:#b4c2b9;font-size:17px}</style>
<rect width="1000" height="360" rx="10" fill="#101916"/>
<text x="40" y="49" font-size="27" font-weight="700">J2 / J3：0°～126° 单侧软件工作区间</text>
<text x="40" y="82" class="small">180° 参考跨度 × 70% = 126°　/　保留70%工作跨度，预留30%缓冲</text>
<rect x="60" y="138" width="880" height="34" fill="#2d3d34"/><rect x="60" y="138" width="616" height="34" fill="#bfd64e"/>
<path d="M60 124v62M676 116v78M940 124v62" fill="none" stroke="#c8d4cb" stroke-width="2"/>
<text x="49" y="215" font-size="23">0°</text><text x="642" y="215" font-size="23">126°</text><text x="910" y="215" font-size="23">180°</text>
<text x="222" y="162" font-size="18" style="fill:#172319">手动目标工作区间</text><text x="741" y="162" font-size="17">参考缓冲区</text>
<path d="M650 261H390l14-9M390 261l14 9" stroke="#bfd64e" stroke-width="3" fill="none"/>
<text x="436" y="295" class="small">反向允许，平滑回入</text>
<path d="M693 261h150M829 249l24 24M853 249l-24 24" stroke="#e8b98b" stroke-width="3" fill="none"/>
<text x="717" y="295" class="small">继续向外被挡住</text>
<text x="40" y="333" class="small">其他关节和返回按键继续可用；这不是取消电机固件保护，也不代表实物硬限位验收。</text>
</svg>

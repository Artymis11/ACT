<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">B601-RS北通XInput手柄映射</title><desc id="desc">按住LB遥操：左摇杆J1和J2，右摇杆J3和J4，方向键J5和J6，RT张开LT闭合。X使能，A长按3秒回本次起点失能，B回零失能，Y只回本次起点。RB换速度档。</desc>
<style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;fill:#eaf1ec}.muted{fill:#aebeb4}.caption{font-size:17px}.label{font-size:20px;font-weight:600}.small{font-size:15px}.wire{stroke:#718575;stroke-width:2;fill:none;stroke-linejoin:round}.body{fill:#24322c;stroke:#718575;stroke-width:3}.button{fill:#142019;stroke:#607369;stroke-width:2}</style>
<rect width="1200" height="760" rx="12" fill="#101916"/>
<text x="40" y="49" font-size="29" font-weight="700">B601-RS · 手柄操作地图</text><text x="40" y="82" class="caption muted">Windows XInput 标准化映射 / 运动操作需要按住 LB</text>
<path class="body" d="M390 204Q445 177 510 199H690Q755 177 810 204L883 486Q895 550 851 560Q818 565 790 521L738 460H462L410 521Q382 565 349 560Q305 550 317 486Z"/>
<rect x="384" y="147" width="133" height="40" rx="13" class="button"/><text x="435" y="174" class="label">LB</text>
<rect x="683" y="147" width="133" height="40" rx="13" class="button"/><text x="733" y="174" class="label">RB</text>
<path d="M414 141v-21h68v21M718 141v-21h68v21" class="wire"/><text x="433" y="111" class="small muted">LT</text><text x="738" y="111" class="small muted">RT</text>
<circle cx="452" cy="291" r="49" class="button"/><circle cx="452" cy="291" r="29" fill="#45574b"/>
<path d="M452 270v42M431 291h42" stroke="#a5b7a9" stroke-width="2"/>
<circle cx="665" cy="426" r="49" class="button"/><circle cx="665" cy="426" r="29" fill="#45574b"/><path d="M665 405v42M644 426h42" stroke="#a5b7a9" stroke-width="2"/>
<path d="M433 382h35v28h28v35h-28v28h-35v-28h-28v-35h28Z" class="button"/>
<circle cx="750" cy="251" r="22" fill="#e7cb4f"/><text x="743" y="258" fill="#172319" font-size="19" font-weight="700" style="fill:#172319">Y</text>
<circle cx="710" cy="291" r="22" fill="#6baad8"/><text x="703" y="298" font-size="19" font-weight="700" style="fill:#172319">X</text>
<circle cx="790" cy="291" r="22" fill="#e59484"/><text x="783" y="298" font-size="19" font-weight="700" style="fill:#172319">B</text>
<circle cx="750" cy="331" r="22" fill="#a6cf69"/><text x="742" y="338" font-size="19" font-weight="700" style="fill:#172319">A</text>
<rect x="556" y="273" width="25" height="16" rx="8" class="button"/><rect x="617" y="273" width="25" height="16" rx="8" class="button"/>
<text x="40" y="210" class="label">左摇杆</text><text x="40" y="242" class="caption">左右 J1 · 右＋ / 左−</text><text x="40" y="270" class="caption">上下 J2 · 上＋ / 下−</text><path d="M278 244h60l65 48" class="wire"/>
<text x="40" y="390" class="label">方向键</text><text x="40" y="422" class="caption">上下 J5 · 上＋ / 下−</text><text x="40" y="450" class="caption">左右 J6 · 左＋ / 右−</text><path d="M283 427h122" class="wire"/>
<text x="922" y="210" class="label">LT / RT · J7 夹爪</text><text x="922" y="242" class="caption">LT 闭合 / RT 张开</text><path d="M785 120h102v101h24" class="wire"/>
<text x="922" y="390" class="label">右摇杆</text><text x="922" y="422" class="caption">上下 J3 · 上＋ / 下−</text><text x="922" y="450" class="caption">左右 J4 · 右＋ / 左−</text><path d="M714 426h197" class="wire"/>
<text x="520" y="514" class="small muted">可同时操作多个关节</text>
<line x1="40" x2="1160" y1="598" y2="598" stroke="#3a4d40"/>
<text x="40" y="638" class="label">X</text><text x="82" y="638" class="caption">使能 / 恢复</text>
<text x="330" y="638" class="label">A 长按3秒</text><text x="330" y="669" class="caption">回本次起点后失能</text>
<text x="630" y="638" class="label">B</text><text x="672" y="638" class="caption">缓慢回零后失能</text>
<text x="930" y="638" class="label">Y</text><text x="972" y="638" class="caption">只回本次起点</text>
<text x="40" y="719" class="small muted">RB：松 LB、全部回中后切换 25% / 50% / 100%　·　方向键与扳机也要回中　·　Start 不承担恢复功能</text>
</svg>
